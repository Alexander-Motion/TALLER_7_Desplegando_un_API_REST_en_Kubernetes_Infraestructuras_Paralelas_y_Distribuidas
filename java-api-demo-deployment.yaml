apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-api-demo
  namespace: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-api-demo
  template:
    metadata:
      labels:
        app: java-api-demo
    spec:
      containers:
        - name: java-api-demo
          image: 2125498/java-api-demo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service.demo-app.svc.cluster.local:2392/demo
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: postgres
          readinessProbe:
            httpGet:
              path: /api/demo/student/all
              port: 8085
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: java-api-demo-service
  namespace: demo-app
spec:
  selector:
    app: java-api-demo
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
  type: LoadBalancer